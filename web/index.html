<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!-- Se reemplaza con --base-href al compilar (en GitHub Pages: /Monchosos_Gestor/app/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gestor de la hamburguesería Monchosos: pedidos, inventario y ventas.">
  <meta name="theme-color" content="#571401">
  <meta name="color-scheme" content="light dark">

  <!-- iPad / iPhone: se instala desde Safari con Compartir → Agregar a inicio. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monchosos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Monchosos</title>

  <style>
    html, body { margin: 0; height: 100%; background: #571401; }
    /* Pantalla de carga mientras baja la app (la primera vez tarda unos segundos). */
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #F6E7E0;
    }
    #cargando img { width: 120px; height: 120px; border-radius: 50%; }
    #cargando .barra { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
    #cargando .barra::after {
      content: ""; display: block; width: 40%; height: 100%; background: #E0A100;
      animation: avanza 1.1s ease-in-out infinite;
    }
    @keyframes avanza { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="cargando" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>Cargando Monchosos…</div>
    <div class="barra"></div>
  </div>
  <script>
    // Quita la pantalla de carga cuando Flutter dibuja su primer cuadro.
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('cargando');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
