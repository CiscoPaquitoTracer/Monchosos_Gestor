# 4 GB alcanzan para esta app (la plantilla pedía 8 GB + 4 GB y la laptop tiene ~10 GB).
# En Jenkins se baja más desde $GRADLE_USER_HOME/gradle.properties (ver Jenkinsfile).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
